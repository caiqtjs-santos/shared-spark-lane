# Projeto usa apenas dependências AndroidX (androidx.core, androidx.appcompat,
# material, etc.) — sem essa flag o Android Gradle Plugin recusa o build com
# "Configuration :app:debugRuntimeClasspath contains AndroidX dependencies,
# but the android.useAndroidX property is not enabled".
android.useAndroidX=true

# Não há dependências da support library antiga (com.android.support:*) neste
# projeto, então o Jetifier não tem nada para reescrever — mas deixamos
# habilitado por segurança, caso uma biblioteca transitiva ainda dependa dela.
android.enableJetifier=true

# Memória do daemon do Gradle no runner do CI.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
