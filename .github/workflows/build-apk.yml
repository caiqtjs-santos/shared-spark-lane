name: Build APK

# Compila o app Android de verdade nos servidores do GitHub (que já vêm
# com o Android SDK pronto) sempre que este código for enviado ao
# repositório, e publica o .apk resultante dentro do próprio site
# (public/app/meu-celular-agente.apk) para virar um link de download
# real e permanente - sem precisar de login no GitHub para baixar.
on:
  push:
    paths:
      - "android-agent/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dar permissão de execução ao gradlew
        working-directory: android-agent
        run: chmod +x ./gradlew

      - name: Compilar o APK de debug
        working-directory: android-agent
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar o APK como artefato do Actions (histórico de builds)
        uses: actions/upload-artifact@v4
        with:
          name: meu-celular-agente-debug
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Copiar o APK para dentro do site (public/app)
        run: |
          mkdir -p public/app
          cp android-agent/app/build/outputs/apk/debug/app-debug.apk public/app/meu-celular-agente.apk

      - name: Publicar o APK de volta no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app/meu-celular-agente.apk
          if git diff --cached --quiet; then
            echo "APK sem mudanças - nada para publicar."
          else
            git commit -m "chore: publicar novo build do app Android [skip ci]"
            git push
          fi
