name: Build APK

# Compila o app Android de verdade nos servidores do GitHub (que já vêm com o
# Android SDK pronto) e publica o .apk resultante dentro do próprio site
# (public/app/meu-celular-agente.apk).
#
# A chave de assinatura NUNCA fica no repositório. Ela vem dos secrets do
# repositório (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64          - o arquivo .jks codificado em base64
#   KEYSTORE_STORE_PASSWORD  - senha do keystore
#   KEYSTORE_KEY_ALIAS       - alias da chave (ex.: meucelular)
#   KEYSTORE_KEY_PASSWORD    - senha da chave
# O arquivo decodificado vive só durante a execução, em um diretório temporário
# que morre junto com o runner.
on:
  push:
    paths:
      - "android-agent/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decodificar a chave de assinatura (temporária)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o secret KEYSTORE_BASE64 (e as senhas) em Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Dar permissão de execução ao gradlew
        working-directory: android-agent
        run: chmod +x ./gradlew

      - name: Compilar o APK de release assinado
        working-directory: android-agent
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Apagar a chave do runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"

      - name: Publicar o APK como artefato do Actions (histórico de builds)
        uses: actions/upload-artifact@v4
        with:
          name: meu-celular-agente-release
          path: android-agent/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Copiar o APK para dentro do site (public/app)
        run: |
          mkdir -p public/app
          cp android-agent/app/build/outputs/apk/release/app-release.apk public/app/meu-celular-agente.apk

      - name: Publicar o APK de volta no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/app/meu-celular-agente.apk
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "chore: publicar novo build assinado do app Android [skip ci]"
            git push
          fi
